services:
  - type: web
    name: eps-villavicencio
    runtime: docker
    plan: free
    region: oregon
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: eps-villavicencio-db
          property: connectionString
      - key: APP_ACCESS_PASSWORD
        generateValue: true

databases:
  - name: eps-villavicencio-db
    plan: free
    region: oregon
    databaseName: eps_villavicencio
    user: eps_app
